<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Fic Library</title>
<script>try{var t=localStorage.getItem("theme");if(t){document.documentElement.dataset.theme=t;}}catch(e){}</script>
<link rel="icon" type="image/png" href="favicon.png?v=1793402415">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1793402415">
<link rel="stylesheet" href="style.css?v=1793402415">
</head>
<body>
<header class="topbar">
  <span class="grow"></span>
  <a class="kudos-link" id="kudos-link" href="kudos.html">♡ kudos list</a>
  <button type="button" id="font-minus" aria-label="Smaller text">A-</button>
  <button type="button" id="font-plus" aria-label="Larger text">A+</button>
  <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch theme"></button>
</header>
<header class="hero">
  <h1><a href="index.html">My Fic Library</a></h1>
  <div class="rule"></div>
  <p>28 fics archived</p>
  <p>Last updated October 30, 2026</p>
</header>
<main class="wrap">
  <details class="filters">
    <summary>Filter &amp; search</summary>
    <div class="controls">
      <input type="search" id="q" placeholder="Search titles, authors, tags, summaries" aria-label="Search">
      <div class="row">
        <select id="rating" aria-label="Rating"></select>
        <select id="status" aria-label="Status"></select>
        <select id="fandom" aria-label="Fandom"></select>
      </div>
      <div class="row"><button type="button" id="clear">Clear filters</button></div>
    </div>
  </details>
  <div class="sortbar" id="sortbar">
    <span class="label">Sort:</span>
    <button type="button" class="pill" data-sort="updated" data-label="Updated" aria-pressed="true">Updated</button>
    <button type="button" class="pill" data-sort="words" data-label="Words" aria-pressed="false">Words</button>
    <button type="button" class="pill" data-sort="title" data-label="A–Z" aria-pressed="false">A&ndash;Z</button>
    <button type="button" class="pill" data-sort="author" data-label="Author" aria-pressed="false">Author</button>
    <button type="button" class="pill" id="random">Random</button>
  </div>
  <div class="active-tags" id="active-tags"></div>
  <p class="count" id="count" aria-live="polite"></p>
  <ol class="works" id="works"></ol>
  <p class="empty" id="empty" hidden>No fics match these filters. Try removing a tag or clearing the filters.</p>
  <button type="button" class="load-more" id="more" hidden>Show more</button>
</main>
<script src="data.js?v=1793402415"></script>
<script src="theme.js?v=1793402415"></script>
<script src="kudos.js?v=1793402415"></script>
<script src="app.js?v=1793402415"></script>
</body>
</html>
