<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>My archive</title>
<script>try{var t=localStorage.getItem("theme");if(!t){t=window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png?v=1793671355">
<link rel="shortcut icon" href="favicon.ico?v=1793671355">
<meta name="apple-mobile-web-app-title" content="My archive">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1793671355">
<link rel="stylesheet" href="style.css?v=1793671355">
</head>
<body data-page="library">
<header class="topbar">
  <div class="tb-left"></div>
  <div class="tb-center"></div>
  <div class="tb-right">
    <button type="button" id="font-minus" aria-label="Smaller text">A-</button>
    <button type="button" id="font-plus" aria-label="Larger text">A+</button>
    <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch theme"></button>
  </div>
</header>
<header class="hero">
  <img class="star" src="star.png?v=1793671355" alt="">
  <h1><a href="index.html">My archive</a></h1>
  <p>525 fics archived</p>
  <p>Last updated November 2, 2026</p>
</header>
<nav class="tabs" aria-label="Sections"><a href="index.html" aria-current="page">The Library</a><a href="reading.html">Currently Reading</a><a href="kudos.html">My Favorites</a><a href="history.html">Reading History</a><a href="stats.html">Statistics</a></nav>
<main class="wrap">
  <div class="continue" id="continue" hidden></div>
  <div class="searchrow">
    <button type="button" id="filter-toggle" aria-expanded="false" aria-controls="fpanel">Filter</button>
    <input type="search" id="q" placeholder="Search" aria-label="Search">
  </div>
  <div class="fpanel" id="fpanel" hidden>
    <div class="fgroup" id="f-rating"><span class="flabel">Rating</span></div>
    <div class="fgroup" id="f-status"><span class="flabel">Status</span></div>
    <div class="fgroup" id="f-read"><span class="flabel">Reading</span></div>
    <div class="fgroup" id="f-fandom-row"><span class="flabel">Fandom</span><select id="fandom" aria-label="Fandom"></select></div>
    <button type="button" class="fclear" id="clear">Clear filters</button>
  </div>
  <div class="sortbar" id="sortbar">
    <span class="label">Sort:</span>
    <button type="button" class="pill" data-sort="default" data-label="Default" aria-pressed="true">Default</button>
    <button type="button" class="pill" data-sort="added" data-label="Added" aria-pressed="false">Added</button>
    <button type="button" class="pill" data-sort="updated" data-label="Updated" aria-pressed="false">Updated</button>
    <button type="button" class="pill" data-sort="words" data-label="Words" aria-pressed="false">Words</button>
    <button type="button" class="pill" data-sort="title" data-label="A–Z" aria-pressed="false">A&ndash;Z</button>
    <button type="button" class="pill" data-sort="author" data-label="Author" aria-pressed="false">Author</button>
    <button type="button" class="pill" id="random">Try your luck ⚃</button>
  </div>
  <div class="active-tags" id="active-tags"></div>
  <ol class="works" id="works"></ol>
  <p class="empty" id="empty" hidden>No fics match these filters. Try removing a tag or clearing the filters.</p>
  <button type="button" class="load-more" id="more" hidden>Show more</button>
  <p class="count" id="count" aria-live="polite"></p>
</main>
<footer class="foot"><a href="sync.html">Sync across devices</a></footer>
<script src="data.js?v=1793671355"></script>
<script src="theme.js?v=1793671355"></script>
<script src="state.js?v=1793671355"></script>
<script src="cards.js?v=1793671355"></script>
<script src="app.js?v=1793671355"></script>
</body>
</html>
